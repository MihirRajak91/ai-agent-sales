[project]
name = "gritfeatv3"
version = "0.1.0"
description = "Multi-tenant Conversational Sales Agent"
authors = [
    {name = "MihirRajak91",email = "mihirrajak91@gmail.com"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "fastapi (>=0.119.0,<0.120.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pymongo (>=4.15.3,<5.0.0)",
    "pinecone (>=7.3.0,<8.0.0)",
    "google-genai (>=1.45.0,<2.0.0)",
    "google-api-python-client (>=2.185.0,<3.0.0)",
    "google-auth (>=2.41.1,<3.0.0)",
    "google-auth-oauthlib (>=1.2.2,<2.0.0)",
    "numpy (>=1.26,<2.0)",
    "streamlit (>=1.50.0,<2.0.0)",
    "pypdf (>=6.1.2,<7.0.0)",
    "tiktoken (>=0.7.0,<0.8.0)",
    "python-multipart (>=0.0.9,<0.0.10)",
    "langchain (==0.2.12)",
    "langchain-google-genai (==1.0.10)",
    "langgraph (>=0.1.0,<0.2.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "python-dateutil (>=2.9.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
mongomock = ">=4.1.2,<5.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
